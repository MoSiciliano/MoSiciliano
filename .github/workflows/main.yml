name: generate animation
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
    - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: MoSiciliano
          outputs: dist/github-contribution-grid-snake.svg
      - uses: actions/checkout@v4
        with:
          ref: output
          path: output
      - run: |
          cp -r dist/* output/
      - name: push
        run: |
          cd output
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "generate animation" || exit 0
          git push
